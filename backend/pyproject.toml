[project]
name = "atrium"
version = "0.1.0"
description = "Self-hosted team chat where customers join shared channels by link and AI agents work only in an internal backroom."
license = "AGPL-3.0-or-later"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0.36",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.6",
  "argon2-cffi>=23.1",
  "python-multipart>=0.0.18",
  "anthropic>=0.40",
  "httpx>=0.28",
  "pyyaml>=6.0",
  "weasyprint>=63",
]

[project.optional-dependencies]
notes = ["faster-whisper>=1.1", "numpy>=1.26"]

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["atrium"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
